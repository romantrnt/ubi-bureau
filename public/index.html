        <div class="settings-panel list-panel" id="langPanel">
          <div class="setting-label" data-t="language"></div>
          <div class="pick-list" id="langList" role="listbox"></div>
        </div>
      </details>
      <details class="settings menu" id="settingsMenu">
        <summary class="btn" aria-controls="settingsPanel" data-a="settings"><svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.5 7.5 0 0 0-2.6-1.5L14.1 2.6h-4l-.4 2.4A7.5 7.5 0 0 0 7.1 6.5l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9a7.5 7.5 0 0 0 2.6 1.5l.4 2.4h4l.4-2.4a7.5 7.5 0 0 0 2.6-1.5l2.3.9 2-3.4z"/></svg><span data-t="settings"></span></summary>
        <div class="settings-panel prefs-panel" id="settingsPanel">
          <label class="setting-row" for="appearance">Appearance<select id="appearance"><option value="light">Day shift</option><option value="dark">Night shift</option></select></label><div class="setting-toggles">
            <label class="tog"><span data-t="subagents"></span><input type="checkbox" role="switch" id="showSub"></label>
            <label class="tog" id="idleToggle"><span data-t="showIdle"></span><input type="checkbox" role="switch" id="showIdle"></label>

            <label class="tog" id="soundToggle"><span data-t="sound"></span><input type="checkbox" role="switch" id="sound"></label>

  <p class="pip-error" id="pipError" role="alert" hidden></p>

  </div>
  <div id="officeWrap">
    <div class="office loading" id="office"><div class="office-loader"><div class="spin"></div><span id="loaderText"></span></div></div>

    <div class="legend" id="agentLegend" hidden></div>
  </div>
  <aside class="side" id="side" aria-label="Agents">
    <div class="side-pane" id="sideList">
      <div class="side-head"><b id="sideTitle"></b><span class="side-count" id="sideCount"></span>
        <button class="icon-btn" id="sideHide" aria-label="Hide sessions"><svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L21 12l-6.5 6.5M3 12h17"/></svg></button></div>
      <div class="roster-tools">
        <div class="roster-scope" role="group" aria-label="Session period"><button id="currentScope" data-scope="current" aria-pressed="true">Current <b id="currentCount">0</b></button><button id="historyScope" data-scope="history" aria-pressed="false">History <b id="historyCount">0</b></button></div>
        <input id="agentSearch" name="agent-search" type="search" placeholder="Find a session…" aria-label="Search by title, folder or ID" autocomplete="off">
        <div class="roster-filters" role="group" aria-label="Status filters"><button data-filter="all" aria-pressed="true">All</button><button data-filter="attention" aria-pressed="false">Needs you</button><button data-filter="working" aria-pressed="false">Working</button><button data-filter="unknown" aria-pressed="false">Unknown</button></div>

<script src="/i18n.js"></script>
<script src="/office.js"></script>
<script src="/popout.js"></script>

<script>
for(const [key,label,src] of [['dot','Dot','/assets/agents/dot.svg'],['codex','Codex','/assets/agents/codex.svg']]) { const b=OFFICE_AGENT_BADGES[key]; if(b){b.label=label;b.logo=src;b.image.src=src;} }
// Language: your pick in the 🌐 menu, else the language of your prompts
// (the server guesses it), else the browser's, else English.
let L = I18N.en;
let langCode = 'en';
let rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto', style: 'short' });
function chooseLang() { return 'en'; }
function applyLang(code) {
  if (code === langCode && L === I18N[code] && document.documentElement.dataset.localized) return;
  document.documentElement.dataset.localized = 'true';
  langCode = code;
  L = I18N[code];
  document.documentElement.lang = L.html;
  rtf = new Intl.RelativeTimeFormat(L.html, { numeric: 'auto', style: 'short' });
  document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = L[el.dataset.t]));
  document.querySelectorAll('[data-a]').forEach((el) => { el.setAttribute('aria-label', L[el.dataset.a]); el.title = L[el.dataset.a]; });
  const legend = document.getElementById('legend');
  if (legend) legend.innerHTML = ['thinking', 'tool', 'typing', 'waiting', 'done', 'error']
    .map((k) => `<span data-s="${k}"><span class="dot" style="color:var(--s)"></span>${L[k]}</span>`).join('');
  if (typeof renderLangMenu === 'function') renderLangMenu();
  if (typeof office !== 'undefined' && office) office.offDutyLabel = L.wentHome;
  if (typeof syncControls === 'function') syncControls();
  if (typeof renderSceneSel === 'function') renderSceneSel();
  if (typeof renderVersion === 'function') renderVersion();
}

const store = (() => {
  const fallback = new Map();
  const get = (k, d) => { try { const v = localStorage.getItem('bureau.' + k); return v == null ? d : JSON.parse(v); } catch { return fallback.has(k) ? fallback.get(k) : d; } };
  const set = (k, v) => { fallback.set(k, v); try { localStorage.setItem('bureau.' + k, JSON.stringify(v)); } catch {} };
  return { get, set };
})();

const PREF_DEFAULTS = { view: 'office', quality: 'high', scene: 'office', agents: [], showSub: false, showIdle: false, showAgent: true, sound: false, notify: true, side: true, lang: 'en', theme: 'dark' };
function validAgentId(v) {
  return typeof v === 'string' && v !== 'all' && /^[a-zA-Z][a-zA-Z0-9_-]{0,63}$/.test(v) && !Object.hasOwn(Object.prototype, v);
}
function validPreference(k, v) {
  if (!Object.hasOwn(PREF_DEFAULTS, k)) return false;
  if (typeof PREF_DEFAULTS[k] === 'boolean') return typeof v === 'boolean';
  if (k === 'theme') return ['light','dark'].includes(v);
  if (k === 'view') return ['office', 'list'].includes(v);
  if (k === 'quality') return ['mid', 'high'].includes(v);
  // Which agents to show; none selected means all of them.
  if (k === 'agents') return Array.isArray(v) && v.length <= 32 && v.every(validAgentId);
  if (k === 'lang') return v === 'auto' || Object.hasOwn(I18N, v);
  return typeof v === 'string' && /^[a-z0-9-]+$/.test(v);
}
// The filter used to be one agent or 'all'; carry an old single choice over once.
{
  const old = store.get('agent', 'all');
  if (validAgentId(old) && !store.get('agents', []).length) store.set('agents', [old]);
  if (old !== 'all') store.set('agent', 'all');
}
function readPreferences() {
  return Object.fromEntries(Object.entries(PREF_DEFAULTS).map(([k, d]) => {
    const v = store.get(k, d);
    return [k, validPreference(k, v) ? v : d];
  }));
}
const NATIVE = new URLSearchParams(location.search).get('native') === '1';
const PIP = new URLSearchParams(location.search).get('pip') === '1';
if (PIP) document.body.classList.add('pip');
if (NATIVE) document.body.classList.add('native');

// ?view=office&quality=high&scene=pirate (what `--scene` opens) sets the prefs.
{
  const q = new URLSearchParams(location.search);
  if(q.get('dotOffice') === '1'){for(const key of ['showSub','showIdle'])if(store.get(key,null)===null)store.set(key,true);}
  if (PIP) {
    try {
      for (const [k, v] of Object.entries(JSON.parse(q.get('prefs')) || {})) if (validPreference(k, v)) store.set(k, v);
    } catch { /* malformed preferences use the saved defaults */ }
  }
  for (const k of ['view', 'quality', 'scene', 'lang']) if (validPreference(k, q.get(k))) store.set(k, q.get(k));
  const mode = new URLSearchParams(); if(NATIVE)mode.set('native','1');if(PIP)mode.set('pip','1');
  if (location.search) history.replaceState(null, '', location.pathname + (mode.size ? '?' + mode : ''));
}

const state = {
  ...readPreferences(),
  quality:'high', search:'', statusFilter:'all', scope:'current', historyLimit:60, connected:false, receivedAt:null,
  // The dashboard is always the full-window office with the agent panel; the pop-out keeps its compact views.
  full: !PIP,
  scenes: [],
  data: { now: Date.now(), sessions: [] },
  skew: 0,
  prev: new Map(),
  prevStuck: new Set(),
  flash: new Set(),
};
let popout = null;

const ACTIVE = new Set(['thinking', 'tool', 'typing']);
const AGENT_NAME = Object.fromEntries(Object.entries(OFFICE_AGENT_BADGES).map(([agent, badge]) => [agent, badge.label]));
const GROUPS = [
  { key: 'needsYou', match: (s) => s === 'waiting' || s === 'error' },
  { key: 'working', match: (s) => ACTIVE.has(s) },
  { key: 'finished', match: (s) => s === 'done' || s === 'interrupted' },
  { key: 'idle', match: (s) => s === 'idle' },
  { key: 'unknown', match: (s) => s === 'unknown' },
];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function dur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${String(m % 60).padStart(2, '0')}m`;
}

function ago(t, now) {
  const s = Math.round((t - now) / 1000);
  if (s > -45) return rtf.format(0, 'second');
  const m = Math.round(s / 60);
  if (m > -60) return rtf.format(m, 'minute');
  const h = Math.round(m / 60);
  if (h > -24) return rtf.format(h, 'hour');
  return rtf.format(Math.round(h / 24), 'day');
}

function timeLabel(s, now) {
  if ((ACTIVE.has(s.status) || s.status === 'waiting') && s.turnStartedAt) return dur(now - s.turnStartedAt);
  return s.lastEventAt ? ago(s.lastEventAt, now) : '';
}

// Single-quote for POSIX shells: inside '…' nothing ($(), backticks, $VAR)
// is expanded, so a folder or session name can't run anything when pasted.
const shq = (v) => `'${String(v).replace(/'/g, `'\\''`)}'`;
function resumeCmd(s) {
  if(s.agent === "dot") return null;
  if (s.source === 'magpie') return '';
  if (s.agent === 'omp') return s.resumeCommand || '';
  const cd = s.cwd ? `cd ${shq(s.cwd)} && ` : '';
  if (s.agent === 'claude') return `${cd}claude --resume ${shq(s.id)}`;
  if (s.agent === 'gemini') return `${cd}gemini --resume ${shq(s.sessionId || s.id)}`;
  if (s.agent === 'copilot') return `${cd}copilot --resume ${shq(s.sessionId || s.id)}`;
  if (s.agent === 'antigravity') return `${cd}agy --conversation ${shq(s.id)}`;
  if (s.agent === 'kimi') return `${cd}kimi --session ${shq(s.sessionId || s.id)}`;
  if (s.agent === 'dsh') return `${cd}dsh tui --resume ${shq(s.id)}`;
  if (s.agent === 'grok') return `${cd}grok --resume ${shq(s.id)}`;
  if (s.agent === 'pi') return `${cd}pi --session ${shq(s.sessionId || s.id)}`;
  if (s.agent === 'opencode') return `${cd}opencode --session ${shq(s.id)}`;
  if (s.agent === 'hermes') return s.resumeCommand || '';
  return s.agent === 'codex' ? `${cd}codex resume ${shq(s.id)}` : '';
}

function agentLogo(agent) {
  const badge = OFFICE_AGENT_BADGES[agent];
  return badge ? `<img class="agent-logo${badge.mono ? ' mono' : ''}" src="${badge.logo}" alt="" aria-hidden="true">` : '';
}


function fmtTokens(n) {
  if (n < 1000) return String(n);
  if (n < 1e6) return `${(n / 1e3).toFixed(n < 1e4 ? 1 : 0)}k`;
  return `${(n / 1e6).toFixed(n < 1e7 ? 2 : 1)}M`;
}

// How full the model's context window is, from the latest request in the log.
function contextBar(c) {
  if (!c || !Number.isFinite(c.used) || !Number.isFinite(c.window) || c.window <= 0) return '';
  const pct = Math.min(100, Math.round((c.used / c.window) * 100));
  const tip = `${L.context} ${fmtTokens(c.used)} / ${fmtTokens(c.window)}`;
  return `<div class="ctx${pct >= 85 ? ' full' : pct >= 60 ? ' warn' : ''}" title="${esc(tip)}"><span>${esc(L.context)}</span><span class="bar"><i style="width:${pct}%"></i></span><span>${pct}%</span></div>`;
}

function renderToday() {
  const t = state.data.summary;
  document.getElementById('todayTokens').textContent = t && t.tokens ? fmtTokens(t.tokens) : '';
  const panel = document.getElementById('todayPanel');
  if (!t || !t.agents) { panel.innerHTML = `<div class="today-note">${esc(L.noUsage)}</div>`; return; }
  const agents = Object.entries(t.byAgent).sort((a, b) => b[1].turns - a[1].turns || b[1].tokens - a[1].tokens);
  const projects = Object.entries(t.projects).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 5);
  panel.innerHTML = `
    <div class="today-big">
      <div><b>${t.turns}</b><span>${esc(L.turnsL)}</span></div>
      <div><b>${fmtTokens(t.tokens)}</b><span>${esc(L.tokensL)}</span></div>
      <div><b>${t.agents}</b><span>${esc(L.agentsL)}</span></div>
    </div>
    ${agents.map(([a, v]) => `<div class="today-row">${agentLogo(a)}${esc(AGENT_NAME[a] || a)}<span class="n">${v.turns} ${esc(L.turnsL)} · ${fmtTokens(v.tokens)}</span></div>`).join('')}
    ${projects.length ? `<div class="today-head">${esc(L.topProjects)}</div>` : ''}
    ${projects.map(([p, n]) => `<div class="today-row">${esc(p)}<span class="n">${n} ${esc(L.turnsL)}</span></div>`).join('')}
    <div class="today-note">${esc(L.summaryNote)}</div>`;
}

function card(s, now) {
  const project = s.project || (s.cwd ? s.cwd : '—');
  const title = s.title && s.title !== project ? `<div class="title" title="${esc(s.title)}">${esc(s.title)}</div>` : '';
  const act = s.activity ? `<span class="act" title="${esc(s.activity)}">${esc(s.activity)}</span>` : '';
  const showText = !s.subagent || ACTIVE.has(s.status);
  const q = showText && s.prompt ? `<div class="q" title="${esc(s.prompt)}">${esc(s.prompt)}</div>` : '';
  const r = showText && s.reply && !ACTIVE.has(s.status) ? `<div class="r" title="${esc(s.reply)}">${esc(s.reply)}</div>` : '';
  const err = s.error ? `<div class="err">${esc(s.error)}</div>` : '';
  const sub = s.subagent ? ` · ${L.sub}` : '';
  const stuck = s.stuck ? `<span class="stuck"><svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.2a2 2 0 0 1 3.4 0l7.6 13.1A2 2 0 0 1 19.6 20H4.4a2 2 0 0 1-1.7-2.7z"/><path d="M12 9.5v4.2M12 16.6v.1"/></svg>${esc(L.stuck(s.stuck))}</span>` : '';
  const ctx = contextBar(s.context);
  return `
  <div class="card${s.subagent ? ' sub' : ''}${s.stuck ? ' is-stuck' : ''}${state.flash.has(s.key) ? ' flash' : ''}" data-s="${s.status}" data-key="${esc(s.key)}">
    <div class="top">
      <span class="agent ${esc(s.agent)}">${agentLogo(s.agent)}${esc(s.agentName || AGENT_NAME[s.agent] || s.agent)}</span>
      <span class="project" title="${esc(s.cwd)}">${esc(project)}</span>
      <span class="time" data-time="${esc(s.key)}">${esc(timeLabel(s, now))}</span>
    </div>
    ${title}
    <div class="status"><span class="ind"><i></i><i></i><i></i></span><span class="lbl">${esc(statusLabel(s))}</span>${act}${stuck}</div>
    ${err}${q}${r}${ctx}
    <div class="foot"><span class="model">${esc((s.model || '') + sub)}</span>${resumeCmd(s) ? `<button class="copy" data-copy="${esc(resumeCmd(s))}">${L.copy}</button>` : ''}</div>
  </div>`;
}

const matchAgent = (s) => !state.agents.length || state.agents.includes(s.agent);
const staleError = s => s.status === 'error' && (s.presence?.stale || (Number.isFinite(s.presence?.observedAt || s.lastEventAt) && Date.now()-state.skew-(s.presence?.observedAt || s.lastEventAt)>120000));
const isHistory = s => s.agent !== 'dot' && (['done','interrupted','completed'].includes(s.status) || staleError(s));
const inScene = s => s.agent === 'dot' || ACTIVE.has(s.status) || s.status === 'waiting' || (s.status === 'error' && !staleError(s));
function rosterPool() {
  return state.data.sessions.filter(s => matchAgent(s) && (state.showSub || !s.subagent));
}
function visible() {
  return rosterPool().filter(s =>
    (state.scope === 'history' ? isHistory(s) : !isHistory(s) && (state.showIdle || s.status !== 'idle')) &&
    (!state.search || [agentNameFor(s),s.cwd,s.id,s.project,s.agent,s.model].some(v => String(v || '').toLocaleLowerCase().includes(state.search))) &&
    (state.scope === 'history' || state.statusFilter === 'all' || (state.statusFilter === 'working' ? ACTIVE.has(s.status) : state.statusFilter === 'attention' ? ['waiting','error'].includes(s.status) : s.status === 'unknown' || s.snapshotStale)));
}

function render() {
  const now = Date.now() - state.skew;
  const list = visible();
  const all = rosterPool();

  const count = (f) => all.filter((s) => !isHistory(s) && f(s.status)).length;
  document.getElementById('summary').innerHTML = GROUPS.filter(g => ['needsYou','working','unknown'].includes(g.key)).map((g) => {
    const n = count(g.match); if(!n)return '';
    const color = g.key === 'needsYou' ? 'var(--waiting)' : g.key === 'working' ? 'var(--tool)' : g.key === 'unknown' ? 'var(--faint)' : 'var(--done)';
    return `<span class="chip"><span class="dot" style="color:${color}"></span>${g.key === 'unknown' ? 'Unknown' : L[g.key]} <b>${n}</b></span>`;
  }).join('');

  renderToday();
  renderSide();
  const working = count((s) => ACTIVE.has(s));
  const needs = count(GROUPS[0].match);
  document.title = (needs ? `(${needs}!) ` : working ? `(${working}) ` : '') + 'Ubi Bureau';

  const main = document.getElementById('main');
  const officeMode = state.view === 'office';
  document.body.classList.toggle('telemetry-view', state.full && !officeMode);
  document.getElementById('officeWrap').style.display = officeMode ? '' : 'none';
  // The office decides who sits at a desk and who wanders around.
  const officeList = all.filter(inScene);
  const poppedOut = !!popout?.win;
  // Wait for the first snapshot so people start at their places instead of
  // all walking in through the door.
  if (office && state.loaded) {
    office.telemetry = {sessions:all.filter(s=>!isHistory(s)),connected:state.connected,receivedAt:state.receivedAt,skew:state.skew};
    office.showAgent = state.showAgent;
    office.setVisible(officeMode && !poppedOut);
    office.update(officeList, {snapshot:state.data.sessions});
  }
  const agents = new Set(officeList.map(s => s.agent));
  const legend = document.getElementById('agentLegend');
  const labels = Object.keys(OFFICE_AGENT_BADGES).filter(agent => agents.has(agent))
    .map(agent => `<span>${agentLogo(agent)}${esc(AGENT_NAME[agent])}</span>`).join('');
  if (legend.innerHTML !== labels) legend.innerHTML = labels;
  legend.hidden = !state.showAgent || !labels;
  document.getElementById('idleToggle').style.display = officeMode && !state.full ? 'none' : '';
  if (poppedOut) {
    document.getElementById('officeWrap').style.display = 'none';
    main.innerHTML = `<div class="empty">${esc(L.pipOn)}</div>`;
    hideTip();
    return;
  }
  if (officeMode) {
    main.innerHTML = officeList.length ? '' : `<div class="empty">${esc(L.empty)}</div>`;
    document.getElementById('officeWrap').style.display = officeList.length || state.full ? '' : 'none';
    refreshTip();
    return;
  }
  const groups = PIP ? GROUPS.slice(0, 2) : GROUPS;
  if (!list.some((s) => groups.some((g) => g.match(s.status)))) {
    main.innerHTML = `<div class="empty">${esc(PIP ? L.pipQuiet : L.empty)}</div>`;
    return;
  }
  main.innerHTML = (state.full ? `<div class="telemetry-heading"><h2>${state.scope === 'history' ? 'Session history' : 'Telemetry'}</h2><p>Recent events from local sources. ${state.scope === 'history' ? 'Completed sessions stay in history.' : 'Unconfirmed activity is marked unknown.'}</p></div>` : '') + groups.map((g) => {
    const items = list.filter((s) => g.match(s.status)).slice(0, state.scope === 'history' ? state.historyLimit : 160);
    if (!items.length) return '';
    return `<section><h2>${L[g.key]} <span class="n">${items.length}</span></h2><div class="grid">${items.map((s) => card(s, now)).join('')}</div></section>`;
  }).join('');
}

function tickTimes() {
  if (tipKey) refreshTip();
  const now = Date.now() - state.skew;
  const byKey = new Map(state.data.sessions.map((s) => [s.key, s]));
  document.querySelectorAll('[data-time]').forEach((el) => {
    const s = byKey.get(el.dataset.time);
    if (s) el.textContent = timeLabel(s, now);
  });
  document.querySelectorAll('[data-event-age]').forEach(el=>{const s=byKey.get(el.dataset.eventAge);if(s)el.textContent=eventAge(s);});
}

function statusLabel(s) {
  if (s.source !== 'dot-snapshot') return L[s.status] || s.status;
  return 'Live status unavailable';
}
function onData(data) {
  state.receivedAt = Date.now();

  for (const s of data.sessions) {
    if (!validAgentId(s.agent)) continue;
    if (!Object.hasOwn(AGENT_NAME, s.agent)) AGENT_NAME[s.agent] = s.agentName || s.agent;
  }
  state.skew = Date.now() - data.now;
  const first = state.prev.size === 0;
  state.flash.clear();
  for (const s of data.sessions) {
    const before = state.prev.get(s.key);
    const wasStuck = state.prevStuck.has(s.key);
    const needsYou = s.status === 'waiting' || s.status === 'error';
    let alert = null;
    if (!first && before && before !== s.status && (needsYou || (s.status === 'done' && ACTIVE.has(before)))) {
      alert = s.status === 'done' ? L.doneNote(s.project || s.agent) : `${s.project || s.agent}: ${L[s.status]}`;
    } else if (!first && s.stuck && !wasStuck) {
      alert = `${s.project || s.agent}: ${L.stuck(s.stuck)}`;
    }
    if (alert) {
      state.flash.add(s.key);
      if (!PIP && !s.subagent) {
        if (state.notify && window.Notification && Notification.permission === 'granted') {
          try { new Notification(alert, { body: s.reply || s.activity || '', tag: s.key }); } catch {}
        }
        if (state.sound) chime(s.status === 'done' && !s.stuck ? 'done' : 'attention');
      }
    }
    state.prev.set(s.key, s.status);
    if (s.stuck) state.prevStuck.add(s.key); else state.prevStuck.delete(s.key);
  }
  state.data = data;
  state.loaded = true;
  syncControls();
  applyLang(chooseLang(data.lang));
  render();
}

// A short synthesized chime, so no audio file is bundled: one tone when a turn
// finishes, two rising tones when an agent needs you or looks stuck.
let audio = null;
function chime(kind) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const notes = kind === 'done' ? [660] : [587, 880];
    notes.forEach((f, i) => {
      const t = audio.currentTime + i * 0.16, o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + 0.4);
    });
  } catch {}
}

function markDisconnected() {
  state.connected=false;
  for(const s of state.data.sessions){
    if(!ACTIVE.has(s.status)&&s.status!=='waiting')continue;
    s.presence={...s.presence,kind:'unknown',live:false,stale:true,lastKnownStatus:s.status,reason:'connection-lost'};
    s.status='unknown';
  }
  render();
}
function connect() {
  const es = new EventSource('/events');
  const conn = document.getElementById('conn');
  es.onmessage = (e) => { conn.classList.remove('on'); state.connected=true; onData(JSON.parse(e.data)); };
  es.onerror = () => { conn.classList.add('on'); markDisconnected(); };
}

// Native disclosure keeps settings keyboard-accessible without a modal focus trap.

// ---- office view
const tip = document.getElementById('tip');
let tipKey = null, tipPinned = false, tipAt = { x: 0, y: 0 };
function agentNameFor(s) { return s.title || s.project || (s.agent === 'dot' ? 'Dot' : AGENT_NAME[s.agent]) || s.agent; }
function sourceFor(s) { return `${s.agent === 'dot' ? 'Dot' : AGENT_NAME[s.agent] || s.agent}${s.subagent ? ' · Subagent' : s.agent === 'dot' ? ' · Coordinator' : ''}`; }
function telemetry(s, compact=false) {
  if(s.source==='dot-snapshot')return '';
  const parts=[];
  if(s.model)parts.push(esc(s.model));
  if(Number.isFinite(s.today?.tokens))parts.push(`${fmtTokens(s.today.tokens)} tokens today`);
  return parts.length ? `<div class="telemetry">${parts.map(p=>`<span>${p}</span>`).join('')}</div>` : '';
}
function excerpt(s) {
  if(s.source==='dot-snapshot')return '';
  const reply=!ACTIVE.has(s.status)&&s.reply;
  const text=reply||s.prompt;
  return text ? `<div class="session-excerpt" title="${esc(text)}"><span>${reply?'Reply':'Prompt'}</span> ${esc(String(text).slice(0,220))}</div>` : '';
}
function eventAge(s) {
  const at=s.source==='dot-snapshot'?s.observedAt:s.presence?.observedAt||s.lastEventAt;
  return Number.isFinite(at)?`${s.source==='dot-snapshot'?'Snapshot':'Event'}: ${dur(Date.now()-state.skew-at)} ago`:'Event time unavailable';
}
function evidenceLabel(s) {
  if(s.presence?.source==='demo' && s.agent!=='dot')return 'Demo data';
  if(s.source==='dot-snapshot')return 'Snapshot Dot';
  if(s.presence?.live)return 'Direct signal';
  return s.presence?.source==='database' ? 'Session database' : s.source==='magpie' ? 'Magpie' : 'Session log';
}
function presenceNote(s) {
  if(s.source==='dot-snapshot') return 'Live status and active subagent count are unavailable. This snapshot provides context for the main Dot only.';
  if(s.presence?.live)return 'Status confirmed by a current direct signal from the source.';
  if(s.status==='unknown')return `${({'connection-lost':'The local event stream disconnected. Current status is unknown.','stale-evidence':'No new events for more than two minutes.','no-observation':'The last event time is unavailable.','historical-session':'Saved session without confirmed recent activity.'})[s.presence?.reason] || 'Current process activity is unconfirmed.'}${s.presence?.lastKnownStatus ? ` Last known status: ${L[s.presence.lastKnownStatus] || s.presence.lastKnownStatus}.` : ''}`;
  return isHistory(s) ? 'The session ended according to its log and stays in history.' : 'The log records the latest action. Process availability is unconfirmed.';
}
function renderSources() {
  const dc=state.data.dotConnection;
  const at=state.receivedAt ? hhmm(state.receivedAt) : 'waiting';
  const dot=!dc?.available ? 'Snapshot unavailable' : `${dc.stale ? 'Older snapshot' : 'Latest snapshot'} ${hhmm(dc.observedAt)}`;
  const box=document.getElementById('dotConnection');
  box.dataset.connected=String(state.connected);
  if(!box.querySelector('#sourceDetails'))box.innerHTML='<div class="source-connection"><i class="connection-indicator" aria-hidden="true"></i><strong></strong><span style="margin-left:auto"></span></div><p></p><button class="source-details" id="sourceDetails">Sources and evidence</button>';
  box.querySelector('strong').textContent=state.connected?'Local stream connected':'Local stream disconnected';
  box.querySelector('.source-connection span').textContent=at;
  box.querySelector('p').textContent=`Dot: ${dot}. Active subagents: unavailable.`;
}
function placeTip() {
  if (!tipKey) return;
  const anchor = office?.getAnchor?.(tipKey) || tipAt;
  if(!anchor){hideTip();return;}
  const r = tip.getBoundingClientRect();
  const canvas = document.getElementById('office').getBoundingClientRect();
  const right = state.side && innerWidth > 760 ? sideEl.getBoundingClientRect().left : innerWidth;
  const left = Math.max(12,canvas.left+12), top = Math.max(12,canvas.top+12);
  let x=anchor.x+18, y=anchor.y-r.height-16;
  if(x+r.width>right-12)x=anchor.x-r.width-18;
  x=Math.max(left,Math.min(x,right-r.width-12));
  y=Math.max(top,Math.min(y,innerHeight-r.height-12));
  tip.style.left=x+'px';tip.style.top=y+'px';
}
function refreshTip() {
  if (!tipKey) return;
  const s=state.data.sessions.find(x=>x.key===tipKey);if(!s)return hideTip();
  const when=s.source==='dot-snapshot' ? `Snapshot ${hhmm(s.observedAt)}` : timeLabel(s,Date.now()-state.skew);
  tip.dataset.key=s.key;
  tip.innerHTML=`<div class="agent-peek"><div class="peek-head">${agentLogo(s.agent)}<strong>${esc(agentNameFor(s))}</strong></div><div class="peek-status" style="--s:${statusColor(s.status)}"><i></i>${esc(statusLabel(s))}${s.activity ? `<span class="peek-activity">${esc(s.activity)}</span>` : ''}</div>${excerpt(s)}${contextBar(s.context)}${telemetry(s)}<div class="peek-meta"><span>${esc(sourceFor(s))}</span><span>${esc(eventAge(s)||when)}</span></div></div>`;
  placeTip();
}
function hideTip(){tipKey=null;tipPinned=false;tip.style.display='none';tip.classList.remove('pinned');delete tip.dataset.key;}
const officeOpts={
  compact:PIP,
  onFrame:(renderer)=>{popout?.drawPreview(renderer);if(tipKey)placeTip();},

document.getElementById('sideBack').addEventListener('click', closeDetail);
document.getElementById('sideRows').addEventListener('mouseleave', (e) => { if (e.currentTarget.dataset.stale) renderSide(); });
document.getElementById('sideRows').addEventListener('click', (e) => {
  if(e.target.closest('#historyMore')){state.historyLimit+=60;renderNow();return;}
  const b = e.target.closest('.srow'); if (b) openDetail(b.dataset.key);
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest?.('input, select, textarea, [contenteditable]') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape' && state.full && sel) closeDetail();
});
addEventListener('resize', () => { if (!state.full) return; measureBar(); office?.setInset(panelInset(), false); });
if (state.full) {
  document.body.classList.add('full');
  requestAnimationFrame(measureBar);
  // On a phone the panel would cover the office, so it starts folded away.
  setSide(state.side && !matchMedia('(max-width: 760px)').matches, false);
  syncFull();
}


document.getElementById('main').addEventListener('click',e=>{const card=e.target.closest('.card[data-key]');if(card&&!e.target.closest('button,a'))openDetail(card.dataset.key);});
document.getElementById('overviewBtn').onclick=()=>{hideTip();office?.resetView?.();};
document.getElementById('agentSearch').addEventListener('input',e=>{state.search=e.target.value.toLocaleLowerCase().trim();state.historyLimit=60;renderNow();});
document.querySelector('.roster-scope').addEventListener('click',e=>{const b=e.target.closest('[data-scope]');if(!b)return;state.scope=b.dataset.scope;state.historyLimit=60;document.querySelectorAll('[data-scope]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderNow();});
document.querySelector('.roster-filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;state.statusFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderNow();});
document.getElementById('sideRows').addEventListener('pointerover',e=>{const b=e.target.closest('.srow');if(b&&office)office.hoverKey=b.dataset.key;});
document.getElementById('sideRows').addEventListener('pointerleave',()=>{if(office)office.hoverKey=null;});
document.getElementById('detailBody').addEventListener('click',e=>{const b=e.target.closest('[data-focus-agent]');if(b){if(state.view!=='office')document.getElementById('sceneView').click();office?.focusAgent?.(b.dataset.focusAgent);}});

setInterval(tickTimes, 1000);
</script>
<script src="/bureau-tools.js"></script>
</body>
</html>
